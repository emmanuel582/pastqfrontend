
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="theme-color" content="#faf6f0" />
      <link rel="icon" type="image/svg+xml" href="/pastq-icon.svg" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="apple-touch-icon" href="/pastq-icon-192.png" />
      <script>(function () { var saved; try { saved = localStorage.getItem('pastq-theme'); } catch {} var theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = theme; document.documentElement.classList.toggle('dark', theme === 'dark'); document.documentElement.style.colorScheme = theme; var chrome = document.querySelector('meta[name="theme-color"]'); if (chrome) chrome.content = theme === 'dark' ? '#151515' : '#faf6f0'; })();</script>
      <title>PastQ</title>
      <meta name="description" content="Convert past exam papers into timed CBT practice tests." />
      <meta name="robots" content="index, follow" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
      <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
      <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    <style>
        .boot-skeleton { box-sizing:border-box; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; padding:max(24px,env(safe-area-inset-top)) 24px max(20px,env(safe-area-inset-bottom)); background:#faf6f0; }
        html[data-theme="dark"] .boot-skeleton { background:#151515; }
        .boot-skeleton span { display:block; background:#eadfd3; border-radius:5px; }
        html[data-theme="dark"] .boot-skeleton span { background:#292725; }
        .boot-brand { display:grid; place-items:center; padding:8px 0; }
        .boot-brand span { width:58px; height:25px; }
        .boot-character { display:grid; place-items:center; padding:18px 0 28px; }
        .boot-character span { width:min(22svh,190px); height:min(43svh,400px); border-radius:42% 42% 18% 18%; }
        .boot-actions { width:min(100%,360px); margin:auto; display:grid; gap:8px; }
        .boot-actions>span { height:54px; border-radius:12px; }
        .boot-actions>div { height:48px; display:grid; place-items:center; }
        .boot-actions>div>span { height:14px; width:50px; }
      </style>
    </head>

    <body>
      
      <div id="root"><div class="boot-skeleton" role="status" aria-label="Opening PastQ" aria-busy="true"><div class="boot-brand" aria-hidden="true"><span></span></div><div class="boot-character" aria-hidden="true"><span></span></div><div class="boot-actions" aria-hidden="true"><span></span><div><span></span></div></div></div></div>
      <noscript>Enable JavaScript to open PastQ.</noscript>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
